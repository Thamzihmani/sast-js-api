# GitHub Secret Scanning Configuration
# This file excludes intentional test files from GitHub's push protection
# These files contain fake/example credentials for testing our Secret Scanner

paths-ignore:
  - 'secrets-test.js'
  - '.env.example'
  - 'config-secrets.yml'
  - 'SECRETS-TEST-README.md'

# Note: These files are intentionally vulnerable for security testing
# They contain example credentials that should be detected by secret scanners
# but are safe to commit as they are not real secrets.
